name: Bug Report
description: Report a reproducible problem in the package, CLI, API, notebooks, or tooling.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for the issue to be reproduced locally.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Ingestion
        - Retrieval
        - Generation
        - Evaluation
        - Tracing
        - CLI
        - API
        - Notebooks
        - Docker
        - CI/tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, payloads, sample files, or notebook cells where relevant.
      placeholder: |
        1. Run `...`
        2. Call `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened? Include tracebacks or logs when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0, commit SHA, or branch name"
    validations:
      required: false
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9 or 3.12.4"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: OS, Poetry version, Docker version, browser, or relevant dependency versions.
      placeholder: "Windows 11, Poetry 1.8.3, Docker Desktop ..."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, tokens, private data, and confidential traces from logs.
          required: true
